<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Intermediário 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Cadastro de Usuário</h1>
        <form action="processar.php" method="POST">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>

            <label for="data">Data de Nascimento:</label>
            <input type="date" id="data" name="data" required>

            <p>Gênero:</p>
            <label>
                <input type="radio" name="genero" value="masculino" required> Masculino
                <input type="radio" name="genero" value="feminino" required> Feminino
                <input type="radio" name="genero" value="outro" required> Outro
            </label>
            
            
            <label for="cidade">Cidade:</label>
            
            <select id="cidade" name="cidade">
                <option value="">Selecione uma cidade</option>
                <option value="curitiba">Curitiba</option>
                <option value="londrina">Londrina</option>
                <option value="maringa">Maringá</option>
                <option value="ponta_grossa">Ponta Grossa</option>
            </select>

            <button type="submit">Cadastrar</button>

            <div class="container">
                <h1>Cadastro de Usuário</h1>

                <form>
                    <!-- Campos-->
                </form>
            </div>

            <input type="tel">

            <input type="checkbox" id="termos">

            <label for =termos> Aceito os termos de uso</label>
        </form>
</body>
</html>
