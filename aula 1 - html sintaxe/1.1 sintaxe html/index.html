<!DOCTYPE html>
<!-- Define que o documento utiliza HTML5 -->

<html>
<!-- Início da página HTML -->

<head>
<!-- Contém as configurações da página -->

    <meta charset="UTF-8">
    <!-- Define a codificação dos caracteres -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Faz a página se adaptar a diferentes tamanhos de tela -->

    <title>Aqui fica o Título</title>
    <!-- Define o título que aparece na aba do navegador -->

</head>
<!-- Fim das configurações da página -->

<body>
<!-- Início do conteúdo que será exibido na página -->

    <h1>Título</h1>
    <!-- Cria um título principal -->

    <h2>Subtítulo</h2>
    <!-- Cria um subtítulo -->

    <p>Parágrafo</p>
    <!-- Cria um parágrafo de texto -->

</body>
<!-- Fim do conteúdo exibido -->

</html>
<!-- Fim da página HTML -->
